[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-crawler-engine"
version = "1.0.0"
description = "Scalable Python web crawler and structured data extraction engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Valaboju Anuvardhan", email = "valabojuanuvardhan@example.com" }
]
keywords = [
    "web-crawler",
    "scraper",
    "data-extraction",
    "asyncio",
    "httpx",
    "beautifulsoup",
    "full-text-search"
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=7.0.0",
]

[project.scripts]
web-crawler = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
